<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Green Gradient -->
    <linearGradient id="shetiGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>

    <!-- Warm Golden Grain Gradient -->
    <linearGradient id="grainGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Soft Earth Gradient -->
    <linearGradient id="earthBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854D0E" />
      <stop offset="100%" stop-color="#5B3308" />
    </linearGradient>

    <!-- Background Badge Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#166534" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#shetiGreen)" filter="url(#logoShadow)" />
  
  <!-- Subtle Internal Glow Ring -->
  <rect x="8" y="8" width="104" height="104" rx="26" stroke="#4ADE80" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

  <!-- Soil Furrows / Earth Arches at the Base -->
  <path d="M28 88C38 82 50 80 60 80C70 80 82 82 92 88" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M36 94C44 90 52 88 60 88C68 88 76 90 84 94" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Left Main Leaf Curve (Tech / Nature Harmony) -->
  <path d="M60 82C60 82 32 68 34 40C34 26 46 18 56 22C48 30 50 48 60 62" fill="#DCFCE7" fill-opacity="0.95" />
  <path d="M60 82C60 82 32 68 34 40C34 26 46 18 56 22C48 30 50 48 60 62" stroke="#16A34A" stroke-width="1" />

  <!-- Center Golden Wheat Stem -->
  <path d="M60 84V28" stroke="url(#grainGold)" stroke-width="4" stroke-linecap="round"/>

  <!-- Right Leaf / Sprout (Vibrant Growth) -->
  <path d="M60 76C60 76 86 64 84 38C84 26 74 20 64 24C72 32 70 48 60 58" fill="#4ADE80" />
  <path d="M60 76C60 76 86 64 84 38C84 26 74 20 64 24C72 32 70 48 60 58" stroke="#22C55E" stroke-width="1" />

  <!-- Wheat Grains (Alternating golden awns for agricultural prosperity) -->
  <ellipse cx="60" cy="24" rx="4.5" ry="7" fill="url(#grainGold)" transform="rotate(0 60 24)" />
  
  <ellipse cx="54" cy="34" rx="4" ry="6.5" fill="url(#grainGold)" transform="rotate(-30 54 34)" />
  <ellipse cx="66" cy="38" rx="4" ry="6.5" fill="url(#grainGold)" transform="rotate(30 66 38)" />

  <ellipse cx="53" cy="46" rx="4" ry="6.5" fill="url(#grainGold)" transform="rotate(-32 53 46)" />
  <ellipse cx="67" cy="50" rx="4" ry="6.5" fill="url(#grainGold)" transform="rotate(32 67 50)" />

  <ellipse cx="54" cy="58" rx="3.5" ry="6" fill="url(#grainGold)" transform="rotate(-28 54 58)" />
  <ellipse cx="66" cy="62" rx="3.5" ry="6" fill="url(#grainGold)" transform="rotate(28 66 62)" />

  <!-- Tech Node Dot (Future of Smart Farming) -->
  <circle cx="60" cy="18" r="2.5" fill="#FFFFFF" />
</svg>
